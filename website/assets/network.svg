<svg xmlns="http://www.w3.org/2000/svg" width="620" height="550" viewBox="0 0 620 550" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Trust across a change of path</title><desc id="desc">A schematic network with LoRa links between three radio peers and a separate optional IP path. Signed resources and encrypted envelopes retain their identities above the transport.</desc>
