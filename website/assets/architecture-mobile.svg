<svg xmlns="http://www.w3.org/2000/svg" width="390" height="894" viewBox="0 0 390 894" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Meshticulum architecture, vertical layout</title><desc id="desc">Signed public resources and private encrypted envelopes are separate service paths into bounded reliable flow. Authenticated sessions and journals bind peers, replay decisions and original deadlines. Three carrier choices follow: exclusive serial radio, exclusive Linux SX1262 radio, and experimental TCP. Host applications supply admission and device ownership.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" stroke="#79bfa3" stroke-width="1.5"/></marker></defs>
<g font-family="system-ui,sans-serif">
<text x="28" y="25" fill="#91aa91" font-size="11" letter-spacing="1.4">SERVICES</text>
<rect x="28" y="44" width="334" height="82" fill="#1d3227" stroke="#79bfa3" stroke-opacity=".4"/>
<text x="47" y="72" fill="#f1f0e9" font-size="17">Signed public resources</text><text x="47" y="94" fill="#a5b99a" font-size="12">Publisher manifests · content hashes</text><text x="47" y="113" fill="#a5b99a" font-size="12">Verified chunk resume</text>
<rect x="28" y="146" width="334" height="82" fill="#1d3227" stroke="#79bfa3" stroke-opacity=".4"/>
<text x="47" y="174" fill="#f1f0e9" font-size="17">Private encrypted envelopes</text><text x="47" y="196" fill="#a5b99a" font-size="12">Recipient encryption</text><text x="47" y="215" fill="#a5b99a" font-size="12">Sender signatures</text>
<path d="M362 85H376V249H291V266M195 228V266" stroke="#79bfa3" stroke-opacity=".75" marker-end="url(#arrow)"/>
<rect x="28" y="270" width="334" height="88" fill="#13241d" stroke="#79bfa3" stroke-opacity=".4"/>
<text x="47" y="299" fill="#f1f0e9" font-size="17">Bounded reliable flow</text><text x="47" y="321" fill="#a5b99a" font-size="12">Receiver credit · selective ACKs</text><text x="47" y="343" fill="#a5b99a" font-size="12">Bounded retries · scheduling</text><text x="342" y="299" text-anchor="end" fill="#efb76b" font-size="10" letter-spacing="1">MT05</text>
<path d="M195 358V389" stroke="#79bfa3" stroke-opacity=".75" marker-end="url(#arrow)"/>
<rect x="28" y="393" width="334" height="104" fill="#13241d" stroke="#79bfa3" stroke-opacity=".4"/>
<text x="47" y="422" fill="#f1f0e9" font-size="17">Authenticated session</text><text x="47" y="443" fill="#f1f0e9" font-size="17">+ journals</text><text x="47" y="466" fill="#a5b99a" font-size="12">Peer and service bindings · replay</text><text x="47" y="486" fill="#a5b99a" font-size="12">Original deadline · attempt debt</text>
<path d="M195 497V516H39V795M39 579H57M39 687H57" stroke="#79bfa3" stroke-opacity=".75" marker-end="url(#arrow)"/>
<path d="M39 795H57" stroke="#efb76b" stroke-opacity=".75" stroke-dasharray="3 4" marker-end="url(#arrow)"/>
<text x="63" y="539" fill="#91aa91" font-size="11" letter-spacing="1.4">CARRIERS</text>
<rect x="61" y="550" width="301" height="82" fill="#1d3227" stroke="#79bfa3" stroke-opacity=".4"/>
<text x="79" y="579" fill="#f1f0e9" font-size="17">Serial radio worker</text><text x="79" y="603" fill="#a5b99a" font-size="12">Exclusive device</text><text x="79" y="622" fill="#a5b99a" font-size="12">Finite LoRa transfer</text>
<rect x="61" y="658" width="301" height="82" fill="#1d3227" stroke="#79bfa3" stroke-opacity=".4"/>
<text x="79" y="687" fill="#f1f0e9" font-size="17">Linux SX1262 worker</text><text x="79" y="711" fill="#a5b99a" font-size="12">Exclusive HAT</text><text x="79" y="730" fill="#a5b99a" font-size="12">Finite LoRa transfer</text>
<rect x="61" y="766" width="301" height="82" fill="#13241d" stroke="#efb76b" stroke-opacity=".45" stroke-dasharray="4 4"/>
<text x="79" y="795" fill="#f1f0e9" font-size="17">TCP carrier</text><text x="79" y="819" fill="#c3ae84" font-size="12">Experimental</text><text x="79" y="838" fill="#c3ae84" font-size="12">Finite public-path evidence</text>
<text x="28" y="879" fill="#91aa91" font-size="10">CARRIER RECEIPT ≠ APPLICATION ACCEPTANCE</text>
</g>
