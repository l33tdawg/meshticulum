<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Meshticulum architecture</title><desc id="desc">Two service paths, signed public resources and encrypted private envelopes, feed bounded reliable flow. Authenticated sessions bind peers, replay decisions and original deadlines. Carriers are exclusive serial and SX1262 radio workers and an experimental TCP path. Host applications supply policy and device ownership.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" stroke="#79bfa3" stroke-width="1.5"/></marker></defs>
<g font-family="system-ui,sans-serif"><text x="40" y="27" fill="#91aa91" font-size="9" letter-spacing="1.8">SERVICES</text><text x="1060" y="27" text-anchor="end" fill="#91aa91" font-size="9" letter-spacing="1.4">HOST APPLICATION SUPPLIES ADMISSION + DEVICE OWNERSHIP</text>
<rect x="40" y="45" width="490" height="75" fill="#1d3227" stroke="#79bfa3" stroke-opacity=".35"/><text x="66" y="75" fill="#f1f0e9" font-size="17">Signed public resources</text><text x="66" y="99" fill="#a5b99a" font-size="11">Publisher manifests · content hashes · verified chunk resume</text>
<rect x="570" y="45" width="490" height="75" fill="#1d3227" stroke="#79bfa3" stroke-opacity=".35"/><text x="596" y="75" fill="#f1f0e9" font-size="17">Private encrypted envelopes</text><text x="596" y="99" fill="#a5b99a" font-size="11">Recipient encryption · sender signatures</text>
<path d="M285 120V145M815 120V145" stroke="#79bfa3" stroke-opacity=".7" marker-end="url(#arrow)"/>
<rect x="40" y="147" width="1020" height="60" fill="#13241d" stroke="#79bfa3" stroke-opacity=".35"/><text x="66" y="173" fill="#f1f0e9" font-size="16">Bounded reliable flow</text><text x="66" y="192" fill="#a5b99a" font-size="11">Receiver credit · selective ACKs · bounded retries · scheduling</text><text x="1033" y="176" fill="#efb76b" font-size="9" letter-spacing="1.5" text-anchor="end">MT05</text>
<path d="M550 207V231" stroke="#79bfa3" stroke-opacity=".7" marker-end="url(#arrow)"/>
<rect x="40" y="234" width="1020" height="60" fill="#13241d" stroke="#79bfa3" stroke-opacity=".35"/><text x="66" y="260" fill="#f1f0e9" font-size="16">Authenticated session + journals</text><text x="66" y="279" fill="#a5b99a" font-size="11">Peer and service bindings · replay decisions · original deadline · attempt debt</text><text x="1033" y="263" fill="#efb76b" font-size="9" letter-spacing="1.5" text-anchor="end">DATA + ACK</text>
<path d="M200 294V321M550 294V321" stroke="#79bfa3" stroke-opacity=".7" marker-end="url(#arrow)"/><path d="M900 294V321" stroke="#efb76b" stroke-opacity=".7" stroke-dasharray="3 4" marker-end="url(#arrow)"/>
<rect x="40" y="325" width="320" height="67" fill="#1d3227" stroke="#79bfa3" stroke-opacity=".4"/><text x="63" y="353" fill="#f1f0e9" font-size="15">Serial radio worker</text><text x="63" y="375" fill="#a5b99a" font-size="11">Exclusive device · finite LoRa transfer</text>
<rect x="390" y="325" width="320" height="67" fill="#1d3227" stroke="#79bfa3" stroke-opacity=".4"/><text x="413" y="353" fill="#f1f0e9" font-size="15">Linux SX1262 worker</text><text x="413" y="375" fill="#a5b99a" font-size="11">Exclusive HAT · finite LoRa transfer</text>
<rect x="740" y="325" width="320" height="67" fill="#13241d" stroke="#efb76b" stroke-opacity=".45" stroke-dasharray="4 4"/><text x="763" y="353" fill="#f1f0e9" font-size="15">TCP carrier</text><text x="763" y="375" fill="#c3ae84" font-size="11">Experimental · finite public-path evidence</text>
<text x="40" y="421" fill="#91aa91" font-size="9" letter-spacing="1.3">CARRIER RECEIPT ≠ APPLICATION ACCEPTANCE</text><text x="1060" y="421" text-anchor="end" fill="#91aa91" font-size="9" letter-spacing="1.3">LANTERN → MESHTICULUM</text></g>
</svg>
