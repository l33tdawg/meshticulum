[build-system]
requires = ["setuptools>=80.9,<81", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "meshticulum"
version = "0.1.0"
description = "Bounded authenticated transport and verified resources for mixed radio and IP networks"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "SAGE Foundation"}, {name = "Dhillon Andrew Kannabhiran"}, {name = "Meshticulum contributors"}]
maintainers = [{name = "SAGE Foundation"}, {name = "Dhillon Andrew Kannabhiran"}]
dependencies = ["cryptography>=46.0.3,<51", "PyNaCl>=1.6.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
sage = ["sage-agent-sdk==11.19.10+lantern.20260906", "httpx>=0.28,<1"]

[project.urls]
Repository = "https://github.com/l33tdawg/meshticulum"
"SAGE Foundation" = "https://sage-foundation.net/"
"Main SAGE repository" = "https://github.com/l33tdawg/sage/"

[project.scripts]
meshticulum-service = "meshticulum.bench.service_node:main"
meshticulum-seed = "meshticulum.resources.lamplighter:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"meshticulum.contracts" = ["SPEC.json"]
"meshticulum.scheduler" = ["SPEC.json"]
"meshticulum.bench" = ["SPEC.json"]
"meshticulum.flow" = ["README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
