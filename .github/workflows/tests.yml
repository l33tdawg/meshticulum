name: Source controls
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install '.[dev]'
      - run: python tools/verify_frozen_flow.py
      - run: python tools/check_repository_boundary.py
      - run: python tools/check_docs.py
      - run: python tools/verify_benchmark_report.py
      - run: python -m pytest --junitxml=build/core-tests.xml
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: python tools/check_repository_boundary.py --wheel dist/meshticulum-*.whl
