name: Source controls
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install '.[dev]'
      - if: matrix.python == '3.11'
        run: python -m pip install 'cryptography==46.0.3'
      - run: python tools/verify_frozen_flow.py
      - run: python tools/check_repository_boundary.py
      - run: python tools/check_public_history.py
      - run: python tools/check_docs.py
      - run: python tools/check_website.py
      - run: python tools/verify_benchmark_report.py
      - run: python -m pytest --junitxml=build/core-tests.xml
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: python tools/check_repository_boundary.py --wheel dist/meshticulum-*.whl
  pq-prototype:
    runs-on: ubuntu-latest
    env:
      MESHTICULUM_REQUIRE_PQ: '1'
      MESHTICULUM_XWING_DRAFT_PATH: build/xwing-draft11.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev,pq-prototype]'
      - run: |
          mkdir -p build
          curl --fail --location --max-time 60 --retry 2 https://www.ietf.org/archive/id/draft-connolly-cfrg-xwing-kem-11.txt --output build/xwing-draft11.txt
      - run: python -m pytest tests/test_pq_prototype.py --junitxml=build/pq-tests.xml
      - run: python examples/pq_exchange.py
